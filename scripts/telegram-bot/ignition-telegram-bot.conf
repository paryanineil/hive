; ---------------------------------------------------------------------------
; Ignition Telegram bot — production supervisor program (long-polling worker)
; ---------------------------------------------------------------------------
; Kept as a SEPARATE supervisor file (NOT inside the bench's generated
; supervisor.conf) so `bench setup supervisor` / `bench setup production`
; never overwrites it.
;
; INSTALL (on the production server, as a sudo-capable user):
;   1. Edit the three values marked  <<EDIT>>  below to match this server.
;   2. sudo cp ignition-telegram-bot.conf /etc/supervisor/conf.d/
;   3. sudo supervisorctl reread
;   4. sudo supervisorctl update          # starts the program
;   5. sudo supervisorctl status ignition-telegram-bot
;
; Find the right values on the server:
;   bench path : run `pwd` from inside your frappe-bench dir
;   frappe user: run `whoami` (or `ls -ld` the bench dir owner)
;   python     : <bench>/env/bin/python  (must exist)
; ---------------------------------------------------------------------------

[program:ignition-telegram-bot]
; <<EDIT>> bench path appears 3x below (command, directory, environment, logfile)
command=/home/frappe/frappe-bench/env/bin/python -u -m bwh_hive.bwh_hive.telegram_bot
directory=/home/frappe/frappe-bench/sites
environment=HIVE_SITE="erp2.v12infotech.com",HIVE_SITES_PATH="/home/frappe/frappe-bench/sites"
user=frappe
; ^^ <<EDIT>> set `user` to the OS user that owns the bench (usually "frappe")

autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=15
stopsignal=TERM
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/frappe/frappe-bench/logs/telegram-bot.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; Optional: add this program to the bench's supervisor group so it stops/starts
; alongside the rest. If your bench group is e.g. [group:frappe-bench-web], add
; `ignition-telegram-bot` to its `programs=` list. Not required — it runs fine
; standalone.
