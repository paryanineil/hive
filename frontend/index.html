<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/v12-logo.png" />
    <link rel="apple-touch-icon" href="/images/pwa-192x192.png" />
    <!-- viewport-fit=cover + safe-area padding keeps content clear of the
         notch / home indicator when installed full-screen on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- iOS standalone: Safari ignores the web manifest for these. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ignition" />
    <title>Ignition</title>
  </head>
  <body>
    <div id="root"></div>
		<script>
			window.csrf_token = '{{ frappe.session.csrf_token }}';
			// site_name is required for the realtime socket (Frappe v15+) — specs/v2 09.
			window.site_name = '{{ boot.site_name }}';
		</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
